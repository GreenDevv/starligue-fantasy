name: Post stat leaders (Instagram)

# Déclenche POST /api/cron/post-stat-leaders (§6.7 ARCHITECTURE.md) : publie les
# carrousels "Leaders Starligue" des journées notées pas encore postées. Route
# idempotente côté serveur (SocialPost.dedupeKey) — un déclenchement en trop (double
# run planifié + manuel le même jour) ne republie jamais un post déjà fait.
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC quotidien, juste après sync-ratings/compute-scores
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (n'affiche que ce qui serait publié, sans rien poster)"
        type: boolean
        default: false

jobs:
  post-stat-leaders:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/post-stat-leaders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: |
          url="https://starliguefantasy.fr/api/cron/post-stat-leaders"
          if [ "$DRY_RUN" = "true" ]; then
            url="${url}?dryRun=true"
          fi

          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$url")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)

          echo "$body" | python3 -m json.tool || echo "$body"

          if [ "$status" -ge 300 ]; then
            echo "::error::HTTP $status"
            exit 1
          fi
