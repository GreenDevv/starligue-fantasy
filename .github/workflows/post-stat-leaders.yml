name: Post stat leaders (Instagram)

# Déclenche POST /api/cron/post-stat-leaders (§6.7 ARCHITECTURE.md) : publie les
# carrousels "Leaders Starligue" des journées notées pas encore postées. Route
# idempotente côté serveur (SocialPost.dedupeKey) — un déclenchement en trop (double
# run planifié + manuel le même jour) ne republie jamais un post déjà fait.
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC quotidien, juste après sync-ratings/compute-scores
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (n'affiche que ce qui serait publié, sans rien poster)"
        type: boolean
        default: false

jobs:
  post-stat-leaders:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/post-stat-leaders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: |
          url="https://starliguefantasy.fr/api/cron/post-stat-leaders"
          if [ "$DRY_RUN" = "true" ]; then
            url="${url}?dryRun=true"
          fi

          # La route ne publie qu'UN carrousel par appel (créer 6-8 conteneurs +
          # attendre FINISHED + publier ≈ 50 s ; 3 d'affilée dépassaient le timeout
          # proxy Railway → 502). On rappelle donc l'endpoint tant qu'il renvoie
          # remaining=true. Idempotent côté serveur (SocialPost.dedupeKey).
          # jq est préinstallé sur les runners ubuntu-latest.
          for attempt in 1 2 3 4 5 6; do
            echo "--- Appel $attempt ---"
            response=$(curl -sS -w "\n%{http_code}" --max-time 280 -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "$url")
            body=$(echo "$response" | sed '$d')
            status=$(echo "$response" | tail -n 1)

            echo "$body" | python3 -m json.tool || echo "$body"

            if [ "$status" -ge 300 ]; then
              echo "::error::HTTP $status"
              exit 1
            fi

            failures=$(echo "$body" | jq -r '[.data[]? | select(.success == false) | "\(.kind) J\(.gameweekNumber): \(.reason)"] | join("\n")')
            if [ -n "$failures" ]; then
              echo "::error::Carrousels en échec :"
              echo "$failures"
              exit 1
            fi

            [ "$(echo "$body" | jq -r '.remaining // false')" != "true" ] && break
          done
