name: Cron quotidien (actus + matchs Warm Up/Coupe de France/coupes d'Europe EHF)

# Remplace le service Railway "cron-daily" (image curlimages/curl), qui n'a jamais
# fonctionné : startCommand et cronSchedule tous deux vides côté Railway (confirmé via
# `railway status --json`), donc le conteneur se contentait de lancer `curl` sans
# argument en boucle de crash (ON_FAILURE) sans jamais appeler la moindre route. Même
# classe de bug que celle documentée en ARCHITECTURE.md §6.7 pour post-stat-leaders.yml
# (ENTRYPOINT déjà = curl sur cette image → "curl curl ..." si on passe une commande).
#
# sync-ratings (notes LNH + Match.status/scores) a été extrait dans cron-results.yml
# le 2026-08-01 : horaire différent voulu (le soir, après les matchs, plutôt que le
# matin avec le reste) — cf. ce fichier pour le détail.
#
# Six jobs, cinq indépendants + un qui dépend des deux syncs lnh.fr "hors
# championnat" (l'échec de l'un ne bloque pas les autres, sauf backfill-warmup-logos
# qui a besoin que sync-warmup ET sync-coupe-de-france soient passés) :
#   - sync-news       : scrape lnh.fr + sites de clubs (§16)
#   - sync-warmup     : matchs de préparation ("Warm Up", src/lib/ingestion/
#                       warmup.ts) — calendrier ET résultats en une seule passe,
#                       calendrier global lnh.fr distinct du calendrier Daikin
#                       StarLigue (découvert le 2026-07-31).
#   - sync-coupe-de-france : même calendrier global lnh.fr, compétition "Coupe de
#                       France -" (découverte le 2026-08-01, ajoutée sur le même
#                       principe que Warm Up — src/lib/ingestion/warmup.ts::
#                       syncCoupeDeFranceMatches, même table FriendlyMatch).
#   - sync-champions-league : EHF Champions League Men (clubs Starligue engagés à
#                       ce jour : Nantes/Montpellier/PSG), source différente — API
#                       JSON EHF, pas lnh.fr (découverte le 2026-08-02,
#                       src/lib/data-providers/ehf-scraper.provider.ts) — même
#                       table FriendlyMatch.
#   - sync-european-league : EHF European League Men, même mécanique exacte que
#                       sync-champions-league (même provider, même table). La page
#                       saison 2026/27 n'existe pas encore côté EHF au moment
#                       d'ajouter ce job (2026-08-02, confirmé par l'utilisateur ET
#                       vérifié — 404) : ce job échouera (erreur récupérable)
#                       jusqu'à sa publication, puis fonctionnera automatiquement
#                       sans changement de configuration (contentId/competitionId
#                       découverts dynamiquement par le provider). Cet échec
#                       attendu ne doit PAS empêcher backfill-warmup-logos de
#                       tourner (voir son `if:`).
#   - backfill-warmup-logos : télécharge les logos des nouveaux adversaires hors DB
#                       (D2/étrangers pour Warm Up/Coupe de France, clubs européens
#                       pour EHF Champions League/European League — même dossier
#                       public/clubs/warmup/, un club hors DB a le même logo quelle
#                       que soit la compétition) et les commit sur main pour qu'un
#                       redeploy Railway les embarque (scripts/backfill-warmup-
#                       logos.ts + scripts/backfill-ehf-logos.ts, filesystem prod
#                       éphémère — voir commentaire du job). `if: !cancelled()` :
#                       tourne même si sync-european-league a échoué (cas attendu
#                       tant que la page n'existe pas), seule une vraie annulation
#                       du workflow doit l'empêcher de tourner.
# Les autres routes /api/cron/* (fixtures/résultats API-Sports, snapshot-lineups,
# compute-scores, classement, effectifs, pronostics) restent non planifiées — voir
# ARCHITECTURE.md §6.7.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-news:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/sync-news
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://starliguefantasy.fr/api/cron/sync-news")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)

          echo "$body" | python3 -m json.tool || echo "$body"

          if [ "$status" -ge 300 ]; then
            echo "::error::HTTP $status"
            exit 1
          fi

  sync-warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/sync-warmup
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://starliguefantasy.fr/api/cron/sync-warmup")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)

          echo "$body" | python3 -m json.tool || echo "$body"

          if [ "$status" -ge 300 ]; then
            echo "::error::HTTP $status"
            exit 1
          fi

  sync-coupe-de-france:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/sync-coupe-de-france
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://starliguefantasy.fr/api/cron/sync-coupe-de-france")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)

          echo "$body" | python3 -m json.tool || echo "$body"

          if [ "$status" -ge 300 ]; then
            echo "::error::HTTP $status"
            exit 1
          fi

  sync-champions-league:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/sync-champions-league
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://starliguefantasy.fr/api/cron/sync-champions-league")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)

          echo "$body" | python3 -m json.tool || echo "$body"

          if [ "$status" -ge 300 ]; then
            echo "::error::HTTP $status"
            exit 1
          fi

  sync-european-league:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/sync-european-league
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://starliguefantasy.fr/api/cron/sync-european-league")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)

          echo "$body" | python3 -m json.tool || echo "$body"

          if [ "$status" -ge 300 ]; then
            echo "::error::HTTP $status"
            exit 1
          fi

  # Contrairement aux jobs ci-dessus (simples appels HTTP), celui-ci fait tourner
  # scripts/backfill-warmup-logos.ts ET scripts/backfill-ehf-logos.ts directement
  # sur le runner CI : le build Next.js standalone en prod (Railway) a un
  # filesystem éphémère, public/ n'y est pas réinscriptible à l'exécution (voir
  # src/lib/ingestion/warmup.ts et les scripts eux-mêmes). Seul un commit des logos
  # dans le repo, suivi d'un redeploy Railway, les rend disponibles. Dépend des
  # quatre syncs "hors championnat" (doivent tourner avant, pas en parallèle) pour
  # backfiller les logos des adversaires découverts par CES runs, quelle que soit
  # la compétition. `if: !cancelled()` plutôt que le défaut (qui skip si une
  # dépendance échoue) : sync-european-league échoue tant qu'EHF n'a pas publié la
  # page 2026/27 (cas attendu, voir plus haut), ça ne doit pas empêcher le backfill
  # Warm Up/Coupe de France/Champions League de tourner quand même.
  backfill-warmup-logos:
    needs: [sync-warmup, sync-coupe-de-france, sync-champions-league, sync-european-league]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installer pnpm
        uses: pnpm/action-setup@v6
        with:
          # Version fixée ici plutôt que via packageManager dans package.json :
          # Railway (Nixpacks) lit aussi ce champ et active la même version via
          # corepack pour le build — un plantage connu de corepack + pnpm@11.10.0
          # sur Node 24 (celui utilisé par l'image de build Railway) a cassé le
          # déploiement prod le 2026-08-01 alors que GitHub Actions n'avait besoin
          # de ce pin que pour lui-même.
          version: 11.10.0

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          # pnpm@11.10.0 (packageManager de package.json) exige Node >=22.13 —
          # "Error [ERR_UNKNOWN_BUILTIN_MODULE]: No such built-in module: node:sqlite"
          # sur Node 20 sinon (module ajouté en Node 22).
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Backfill logos Warm Up/Coupe de France (lecture DB prod, écriture locale)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm tsx scripts/backfill-warmup-logos.ts

      - name: Backfill logos EHF Champions League/European League (re-scrape EHF, écriture locale)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm tsx scripts/backfill-ehf-logos.ts

      - name: Committer les nouveaux logos si besoin
        run: |
          git config user.name "starligue-fantasy-bot"
          git config user.email "actions@github.com"
          git add public/clubs/warmup/
          if git diff --cached --quiet; then
            echo "Aucun nouveau logo à committer"
            exit 0
          fi
          git commit -m "chore: backfill logos clubs hors DB (Warm Up/Coupe de France/EHF, auto)"
          # main a pu avancer depuis le checkout du job (autre push pendant que le
          # scraping tournait) — rebase avant de pousser plutôt qu'un push qui
          # échouerait en non-fast-forward (vécu le 2026-08-01 : le fix pnpm-
          # workspace.yaml poussé pendant que ce job tournait a fait échouer le
          # push, alors que le commit local (logos) était pourtant bon).
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

