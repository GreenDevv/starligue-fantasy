name: Cron quotidien (actus lnh.fr + sites de clubs)

# Remplace le service Railway "cron-daily" (image curlimages/curl), qui n'a jamais
# fonctionné : startCommand et cronSchedule tous deux vides côté Railway (confirmé via
# `railway status --json`), donc le conteneur se contentait de lancer `curl` sans
# argument en boucle de crash (ON_FAILURE) sans jamais appeler la moindre route. Même
# classe de bug que celle documentée en ARCHITECTURE.md §6.7 pour post-stat-leaders.yml
# (ENTRYPOINT déjà = curl sur cette image → "curl curl ..." si on passe une commande).
#
# Portée volontairement limitée à sync-news (scrape lnh.fr + sites de clubs, §16) —
# c'est le seul besoin exprimé pour ce cron. Les autres routes /api/cron/* du jeu
# (fixtures, notes, scores, classement, effectifs) restent non planifiées pour
# l'instant, disponibles en déclenchement manuel admin uniquement — voir
# ARCHITECTURE.md §6.7.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  sync-news:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/sync-news
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://starliguefantasy.fr/api/cron/sync-news")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)

          echo "$body" | python3 -m json.tool || echo "$body"

          if [ "$status" -ge 300 ]; then
            echo "::error::HTTP $status"
            exit 1
          fi
