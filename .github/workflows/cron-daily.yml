name: Cron quotidien (actus + notes/résultats + matchs Warm Up/Coupe de France lnh.fr)

# Remplace le service Railway "cron-daily" (image curlimages/curl), qui n'a jamais
# fonctionné : startCommand et cronSchedule tous deux vides côté Railway (confirmé via
# `railway status --json`), donc le conteneur se contentait de lancer `curl` sans
# argument en boucle de crash (ON_FAILURE) sans jamais appeler la moindre route. Même
# classe de bug que celle documentée en ARCHITECTURE.md §6.7 pour post-stat-leaders.yml
# (ENTRYPOINT déjà = curl sur cette image → "curl curl ..." si on passe une commande).
#
# Cinq jobs, quatre indépendants + un qui dépend des deux syncs "hors championnat"
# (l'échec de l'un ne bloque pas les autres, sauf backfill-warmup-logos qui a besoin
# que sync-warmup ET sync-coupe-de-france soient passés) :
#   - sync-news       : scrape lnh.fr + sites de clubs (§16)
#   - sync-ratings    : notes LNH (boxscore) des matchs terminés hier — met aussi à
#                       jour Match.status/homeScore/awayScore depuis lnh.fr
#                       (syncCalendarsIdsForSeason, src/lib/ingestion/boxscore.ts),
#                       utile aux pages de match/club et au règlement des pronostics
#                       (§14), pas seulement au scoring fantasy (qui n'en dépend pas).
#   - sync-warmup     : matchs de préparation ("Warm Up", src/lib/ingestion/
#                       warmup.ts) — calendrier ET résultats en une seule passe,
#                       calendrier global lnh.fr distinct du calendrier Daikin
#                       StarLigue (découvert le 2026-07-31).
#   - sync-coupe-de-france : même calendrier global lnh.fr, compétition "Coupe de
#                       France -" (découverte le 2026-08-01, ajoutée sur le même
#                       principe que Warm Up — src/lib/ingestion/warmup.ts::
#                       syncCoupeDeFranceMatches, même table FriendlyMatch).
#   - backfill-warmup-logos : télécharge les logos des nouveaux adversaires Warm Up
#                       ET Coupe de France hors DB (D2/étrangers) et les commit sur
#                       main pour qu'un redeploy Railway les embarque
#                       (scripts/backfill-warmup-logos.ts, filesystem prod éphémère
#                       — voir commentaire du job).
# ARCHITECTURE.md §4.1 documente sync-ratings 2×/jour (09h/13h) — ici 1×/jour
# seulement (06:00 UTC), même simplification assumée que pour le reste des crons
# non planifiés. Les autres routes /api/cron/* (fixtures/résultats API-Sports,
# snapshot-lineups, compute-scores, classement, effectifs, pronostics) restent non
# planifiées — voir ARCHITECTURE.md §6.7.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-news:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/sync-news
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://starliguefantasy.fr/api/cron/sync-news")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)

          echo "$body" | python3 -m json.tool || echo "$body"

          if [ "$status" -ge 300 ]; then
            echo "::error::HTTP $status"
            exit 1
          fi

  sync-ratings:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/sync-ratings
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://starliguefantasy.fr/api/cron/sync-ratings")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)

          echo "$body" | python3 -m json.tool || echo "$body"

          if [ "$status" -ge 300 ]; then
            echo "::error::HTTP $status"
            exit 1
          fi

  sync-warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/sync-warmup
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://starliguefantasy.fr/api/cron/sync-warmup")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)

          echo "$body" | python3 -m json.tool || echo "$body"

          if [ "$status" -ge 300 ]; then
            echo "::error::HTTP $status"
            exit 1
          fi

  sync-coupe-de-france:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/sync-coupe-de-france
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://starliguefantasy.fr/api/cron/sync-coupe-de-france")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)

          echo "$body" | python3 -m json.tool || echo "$body"

          if [ "$status" -ge 300 ]; then
            echo "::error::HTTP $status"
            exit 1
          fi

  # Contrairement aux jobs ci-dessus (simples appels HTTP), celui-ci fait tourner
  # scripts/backfill-warmup-logos.ts directement sur le runner CI : le build Next.js
  # standalone en prod (Railway) a un filesystem éphémère, public/ n'y est pas
  # réinscriptible à l'exécution (voir src/lib/ingestion/warmup.ts et le script
  # lui-même). Seul un commit des logos dans le repo, suivi d'un redeploy Railway,
  # les rend disponibles. Dépend de sync-warmup ET sync-coupe-de-france (doivent
  # tourner avant, pas en parallèle) pour backfiller les logos des adversaires
  # découverts par CES runs, quelle que soit la compétition.
  backfill-warmup-logos:
    needs: [sync-warmup, sync-coupe-de-france]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          # pnpm@11.10.0 (packageManager de package.json) exige Node >=22.13 —
          # "Error [ERR_UNKNOWN_BUILTIN_MODULE]: No such built-in module: node:sqlite"
          # sur Node 20 sinon (module ajouté en Node 22).
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Backfill logos Warm Up (lecture DB prod, écriture locale)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm tsx scripts/backfill-warmup-logos.ts

      - name: Committer les nouveaux logos si besoin
        run: |
          git config user.name "starligue-fantasy-bot"
          git config user.email "actions@github.com"
          git add public/clubs/warmup/
          if git diff --cached --quiet; then
            echo "Aucun nouveau logo à committer"
            exit 0
          fi
          git commit -m "chore: backfill logos clubs Warm Up (auto)"
          # main a pu avancer depuis le checkout du job (autre push pendant que le
          # scraping tournait) — rebase avant de pousser plutôt qu'un push qui
          # échouerait en non-fast-forward (vécu le 2026-08-01 : le fix pnpm-
          # workspace.yaml poussé pendant que ce job tournait a fait échouer le
          # push, alors que le commit local (logos) était pourtant bon).
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

