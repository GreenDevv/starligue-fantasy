name: Cron quotidien (actus + notes/résultats + matchs Warm Up lnh.fr)

# Remplace le service Railway "cron-daily" (image curlimages/curl), qui n'a jamais
# fonctionné : startCommand et cronSchedule tous deux vides côté Railway (confirmé via
# `railway status --json`), donc le conteneur se contentait de lancer `curl` sans
# argument en boucle de crash (ON_FAILURE) sans jamais appeler la moindre route. Même
# classe de bug que celle documentée en ARCHITECTURE.md §6.7 pour post-stat-leaders.yml
# (ENTRYPOINT déjà = curl sur cette image → "curl curl ..." si on passe une commande).
#
# Trois routes, trois jobs indépendants (l'échec de l'un ne bloque pas les autres) :
#   - sync-news       : scrape lnh.fr + sites de clubs (§16)
#   - sync-ratings    : notes LNH (boxscore) des matchs terminés hier — met aussi à
#                       jour Match.status/homeScore/awayScore depuis lnh.fr
#                       (syncCalendarsIdsForSeason, src/lib/ingestion/boxscore.ts),
#                       utile aux pages de match/club et au règlement des pronostics
#                       (§14), pas seulement au scoring fantasy (qui n'en dépend pas).
#   - sync-warmup     : matchs de préparation ("Warm Up", src/lib/ingestion/
#                       warmup.ts) — calendrier ET résultats en une seule passe,
#                       calendrier global lnh.fr distinct du calendrier Daikin
#                       StarLigue (découvert le 2026-07-31).
# ARCHITECTURE.md §4.1 documente sync-ratings 2×/jour (09h/13h) — ici 1×/jour
# seulement (06:00 UTC), même simplification assumée que pour le reste des crons
# non planifiés. Les autres routes /api/cron/* (fixtures/résultats API-Sports,
# snapshot-lineups, compute-scores, classement, effectifs, pronostics) restent non
# planifiées — voir ARCHITECTURE.md §6.7.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  sync-news:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/sync-news
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://starliguefantasy.fr/api/cron/sync-news")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)

          echo "$body" | python3 -m json.tool || echo "$body"

          if [ "$status" -ge 300 ]; then
            echo "::error::HTTP $status"
            exit 1
          fi

  sync-ratings:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/sync-ratings
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://starliguefantasy.fr/api/cron/sync-ratings")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)

          echo "$body" | python3 -m json.tool || echo "$body"

          if [ "$status" -ge 300 ]; then
            echo "::error::HTTP $status"
            exit 1
          fi

  sync-warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/sync-warmup
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://starliguefantasy.fr/api/cron/sync-warmup")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)

          echo "$body" | python3 -m json.tool || echo "$body"

          if [ "$status" -ge 300 ]; then
            echo "::error::HTTP $status"
            exit 1
          fi
